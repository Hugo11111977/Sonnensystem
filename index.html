<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sonnensystem · Draufsicht</title>
<style>
  :root{
    --txt:#e9efff; --dim:#8d9cc0; --line:rgba(130,165,255,.16); --accent:#6cc6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#sky.grabbing{cursor:grabbing}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(115% 85% at 50% 46%,rgba(0,0,0,0) 38%,rgba(0,0,0,.62) 100%)}

  .glass{background:rgba(10,14,26,.62);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 10px 40px rgba(0,0,0,.45)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:14px;left:14px;padding:12px 16px 11px;z-index:5;pointer-events:none;
    max-width:min(340px,58vw)}
  #hud .eyebrow{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  #hud h1{margin:2px 0 7px;font-size:19px;font-weight:650;letter-spacing:.01em}
  #hud .date{font-size:15px;font-variant-numeric:tabular-nums;color:#d3e3ff}
  #hud .sub{margin-top:3px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .timeRow{margin-top:9px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:auto}
  #dateIn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#dbe7ff;
    font:inherit;font-size:11px;padding:4px 6px;border-radius:8px;outline:none;width:124px;
    color-scheme:dark;font-variant-numeric:tabular-nums;transition:.15s}
  #dateIn:hover{background:rgba(255,255,255,.12)}
  #dateIn:focus{border-color:rgba(120,190,255,.65);box-shadow:0 0 0 3px rgba(108,198,255,.12)}
  #todayBtn{border:1px solid var(--line);background:rgba(108,198,255,.12);color:#bfe8ff;
    font:inherit;font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;transition:.15s;
    white-space:nowrap}
  #todayBtn:hover{background:rgba(108,198,255,.26)}
  #todayBtn:active{transform:scale(.95)}
  #todayBtn.flash{background:rgba(140,255,200,.35);color:#eafff5}

  /* ---------- Einstellungen ---------- */
  #settings{position:fixed;top:14px;right:14px;padding:10px 12px;z-index:5;display:flex;
    flex-direction:column;gap:1px}
  #settings label.tog{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim);
    cursor:pointer;padding:3px 2px;user-select:none}
  #settings input[type=checkbox]{display:none}
  #settings label.tog i{width:26px;height:15px;border-radius:99px;background:rgba(255,255,255,.12);
    position:relative;transition:.18s;flex:0 0 auto}
  #settings label.tog i:after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;
    border-radius:50%;background:#9fb0d4;transition:.18s}
  #settings input[type=checkbox]:checked + i{background:rgba(102,199,255,.35)}
  #settings input[type=checkbox]:checked + i:after{transform:translateX(11px);background:#bfe8ff}
  #settings input[type=checkbox]:checked ~ span{color:#dbe7ff}

  #settings .sep{height:1px;background:var(--line);margin:7px 0 6px}
  #settings .sizeRow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);
    white-space:nowrap;padding:1px 2px}
  #settings .sizeRow b{font-weight:600;color:#cfe0ff;font-variant-numeric:tabular-nums;
    min-width:31px;text-align:right;font-size:10.5px}
  #sizeMul{-webkit-appearance:none;appearance:none;width:68px;height:4px;border-radius:99px;
    background:rgba(255,255,255,.15);outline:none;margin:0;cursor:pointer}
  #sizeMul::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#bfe8ff;cursor:pointer;box-shadow:0 0 8px rgba(110,200,255,.7)}
  #sizeMul::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#bfe8ff;cursor:pointer}

  /* ---------- Untere Leiste ---------- */
  #bar{position:fixed;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;
    justify-content:space-between;flex-wrap:wrap;z-index:6;pointer-events:none}
  #bar > *{pointer-events:auto}

  #chips{display:flex;gap:4px;overflow-x:auto;padding:7px 9px;flex:1 1 300px;min-width:0;
    scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:transparent;
    color:var(--dim);font:inherit;font-size:11.5px;padding:4px 7px;border-radius:8px;
    cursor:pointer;transition:.15s;white-space:nowrap}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .chip.moon{font-size:10.5px;padding:4px 5px;opacity:.82}
  .chip.moon i{width:5px;height:5px;box-shadow:0 0 5px var(--c)}
  .chip:hover{background:rgba(255,255,255,.06);color:#e9efff}
  .chip.on{background:rgba(255,255,255,.11);color:#fff;opacity:1}

  #ctrls{display:flex;align-items:center;gap:7px;padding:7px 10px}
  .btn{border:0;background:rgba(255,255,255,.07);color:#d8e3ff;width:30px;height:30px;
    border-radius:9px;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:.15s;
    flex:0 0 auto;line-height:1}
  .btn:hover{background:rgba(255,255,255,.15)}
  .btn:active{transform:scale(.94)}
  .btn.rev{background:rgba(255,190,120,.16);color:#ffd9a8}
  #speedWrap{display:flex;flex-direction:column;gap:3px;width:128px;padding:0 3px}
  #speed{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
    background:rgba(255,255,255,.15);outline:none;margin:5px 0}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#bfe8ff;cursor:pointer;box-shadow:0 0 10px rgba(110,200,255,.75)}
  #speed::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#bfe8ff;cursor:pointer}
  #speedLbl{font-size:10px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden}

  /* ---------- Info-Panel ---------- */
  #info{position:fixed;right:14px;top:50%;width:290px;max-height:74vh;overflow:auto;padding:15px 17px 16px;
    z-index:7;transform:translate(130%,-50%);transition:transform .34s cubic-bezier(.2,.8,.2,1);
    --c:#6cc6ff}
  #info.show{transform:translate(0,-50%)}
  #info .x{position:absolute;top:9px;right:10px;border:0;background:rgba(255,255,255,.07);
    color:#c8d6f5;width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:15px;line-height:1}
  #info .x:hover{background:rgba(255,255,255,.16)}
  #info .head{display:flex;align-items:center;gap:9px}
  #info .dot{width:11px;height:11px;border-radius:50%;background:var(--c);
    box-shadow:0 0 14px var(--c);flex:0 0 auto}
  #info h2{margin:0;font-size:17px;font-weight:650}
  #info .kind{margin:2px 0 0 20px;font-size:10.5px;color:var(--dim);letter-spacing:.04em}
  #info .grid{margin-top:12px;border-top:1px solid var(--line)}
  #info .grid div{display:flex;justify-content:space-between;gap:14px;padding:6.5px 0;
    border-bottom:1px solid rgba(130,165,255,.08);font-size:11.5px}
  #info .grid span{color:var(--dim)}
  #info .grid b{font-weight:550;text-align:right}
  #info .fact{margin:12px 0 0;font-size:11.5px;line-height:1.55;color:#b7c5e6;
    border-left:2px solid var(--c);padding-left:10px}
  #info .note{margin:9px 0 0;font-size:10.5px;line-height:1.45;color:#8d9cc0;font-style:italic}
  #info .lbl{margin:10px 0 0;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim)}
  #info .moonwrap{display:flex;align-items:center;gap:14px;margin:12px 0 2px}
  #info .moonwrap canvas{width:62px;height:62px;flex:0 0 auto}
  #info .phbig{font-size:12px;color:#dbe7ff;line-height:1.4}

  /* ---------- Hinweis ---------- */
  #tip{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);font-size:11px;color:var(--dim);
    background:rgba(10,14,26,.7);border:1px solid var(--line);padding:7px 14px;border-radius:99px;
    pointer-events:none;transition:opacity .8s;z-index:4;white-space:nowrap}

  @media (max-width:820px){
    #hud{max-width:60vw;padding:9px 12px 8px}
    #hud h1{font-size:15px;margin-bottom:5px}
    #hud .date{font-size:12.5px}
    #hud .sub{display:none}
    #dateIn{width:112px;font-size:10.5px}
    #todayBtn{font-size:10.5px;padding:4px 8px}
    #settings{padding:8px 10px}
    #settings label.tog{font-size:10.5px;gap:7px}
    #settings .sizeRow{font-size:10px;gap:6px}
    #sizeMul{width:56px}
    #info{left:10px;right:10px;width:auto;top:auto;bottom:96px;max-height:46vh;
      transform:translateY(150%);border-radius:16px}
    #info.show{transform:translateY(0)}
    #chips{flex:1 1 100%;order:2;justify-content:flex-start}
    #ctrls{order:1;margin:0 auto;flex:0 0 auto}
    #speedWrap{width:100px}
    #tip{display:none}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="vignette"></div>

<div id="hud" class="glass">
  <div class="eyebrow">Heliozentrische Draufsicht</div>
  <h1>Sonnensystem</h1>
  <div class="date" id="date">—</div>
  <div class="sub" id="sub">—</div>
  <div class="timeRow">
    <input type="date" id="dateIn" min="1600-01-01" max="2400-12-31" step="1" aria-label="Datum wählen">
    <button id="todayBtn" title="Zurück zum heutigen Datum (T)">Heute</button>
  </div>
</div>

<div id="settings" class="glass">
  <label class="tog"><input type="checkbox" id="optOrbits" checked><i></i><span>Bahnen</span></label>
  <label class="tog"><input type="checkbox" id="optTrails" checked><i></i><span>Schweife</span></label>
  <label class="tog"><input type="checkbox" id="optLabels" checked><i></i><span>Namen</span></label>
  <label class="tog"><input type="checkbox" id="optDwarfs" checked><i></i><span>Pluto</span></label>
  <label class="tog"><input type="checkbox" id="optBelt" checked><i></i><span>Gürtel</span></label>
  <label class="tog"><input type="checkbox" id="optScale"><i></i><span>Maßstab</span></label>
  <div class="sep"></div>
  <div class="sizeRow">
    <span>Größe</span>
    <input type="range" id="sizeMul" min="70" max="220" value="100" aria-label="Planetengröße">
    <b id="sizeLbl">1,0×</b>
  </div>
</div>

<div id="info" class="glass"></div>

<div id="tip">Ziehen zum Verschieben · Scrollen zum Zoomen · Planet oder Mond anklicken</div>

<div id="bar">
  <div id="chips" class="glass"></div>
  <div id="ctrls" class="glass">
    <button class="btn" id="dir" title="Zeitrichtung umkehren (D)">⏩</button>
    <button class="btn" id="play" title="Play / Pause (Leertaste)">⏸</button>
    <div id="speedWrap">
      <input type="range" id="speed" min="0" max="100" value="51" aria-label="Geschwindigkeit">
      <span id="speedLbl">—</span>
    </div>
    <button class="btn" id="zoomOut" title="Herauszoomen">−</button>
    <button class="btn" id="zoomIn" title="Hineinzoomen">+</button>
    <button class="btn" id="reset" title="Ansicht zurücksetzen (R)">↺</button>
  </div>
</div>

const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
const nowDays = () => (Date.now() - J2000) / 86400000;

const LOGR = 0.35;
const LOG_REF = Math.log(1 + 1 / LOGR);

const state = {
  t: nowDays(),
  playing: true,
  dir: 1,
  speed: 15,
  zoom: 1,
  panX: 0, panY: 0,

  sizeMul: 1,
  base: 1,

function project(r){
  if (state.trueScale) return r;
  return Math.log(1 + r / LOGR) / LOG_REF;
}

/* =========================================================
   5. Kepler-Mechanik
   ========================================================= */
function solveKepler(M, e){
  M = ((M % TAU) + TAU) % TAU;
  let E = M + e * Math.sin(M) + 0.5 * e * e * Math.sin(2 * M);
  for (let i = 0; i < 12; i++){
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-10) break;
  }
  return E;
}

function bodyWorld(b, t){
  const M = (b.L - b.peri) * DEG + TAU * (t / b.period);
  const E = solveKepler(M, b.e);
  const r = b.a * (1 - b.e * Math.cos(E));
  const v = Math.atan2(Math.sqrt(1 - b.e * b.e) * Math.sin(E), Math.cos(E) - b.e);
  const lam = v + b.peri * DEG;
  const R = project(r);
  return { x: R * Math.cos(lam), y: R * Math.sin(lam) };
}

function bodyLon(b, t){
  const M = (b.L - b.peri) * DEG + TAU * (t / b.period);
  const E = solveKepler(M, b.e);
  const v = Math.atan2(Math.sqrt(1 - b.e * b.e) * Math.sin(E), Math.cos(E) - b.e);
  return norm360(v / DEG + b.peri);
}

function buildPath(b){
  const N = 280, pts = [];
  for (let i = 0; i <= N; i++){
    const E = i / N * TAU;
    const r = b.a * (1 - b.e * Math.cos(E));
    const v = Math.atan2(Math.sqrt(1 - b.e * b.e) * Math.sin(E), Math.cos(E) - b.e);
    const lam = v + b.peri * DEG;
    const R = project(r);
    pts.push(R * Math.cos(lam), R * Math.sin(lam));
  }
  b.path = pts;
}

/* =========================================================
   6. Erdmond: echte Ephemeride (ELP-Hauptterme, Meeus 47)
   ========================================================= */
const MOON_MEAN_DIST = 384400;

function moonEphem(t){
  const T = t / 36525;
  const Lp = 218.3164477 + 481267.88123421*T - 0.0015786*T*T;
  const D  = 297.8501921 + 445267.1114034*T - 0.0018819*T*T;
  const M  = 357.5291092 + 35999.0502909*T - 0.0001536*T*T;
  const Mp = 134.9633964 + 477198.8675055*T + 0.0087414*T*T;
  const F  = 93.2720950 + 483202.0175233*T - 0.0036539*T*T;

  const d2 = 2*D, m2 = 2*Mp, f2 = 2*F;

  const lon = Lp
    + 6.288774*sinD(Mp)
    + 1.274027*sinD(d2 - Mp)
    + 0.658314*sinD(d2)
    + 0.213618*sinD(m2)
    - 0.185116*sinD(M)
    - 0.114332*sinD(f2)
    + 0.058793*sinD(d2 - m2)
    + 0.057066*sinD(d2 - M - Mp)
    + 0.053322*sinD(d2 + Mp)
    + 0.045758*sinD(d2 - M)
    - 0.040923*sinD(M - Mp)
    - 0.034720*sinD(D)
    - 0.030383*sinD(M + Mp)
    + 0.015327*sinD(d2 - f2)
    - 0.012528*sinD(Mp + f2)
    + 0.010980*sinD(Mp - f2)
    + 0.010675*sinD(2*d2 - Mp)
    + 0.010034*sinD(3*Mp)
    + 0.008548*sinD(2*d2 - m2)
    - 0.007888*sinD(d2 + M - Mp)
    - 0.006766*sinD(d2 + M)
    - 0.005163*sinD(D - Mp)
    + 0.004987*sinD(D + M)
    + 0.004036*sinD(d2 - M + Mp)
    + 0.003994*sinD(d2 + m2)
    + 0.003861*sinD(2*d2)
    + 0.003665*sinD(d2 - 3*Mp);

  const dist = 385000.56 + (
      -20905355*cosD(Mp)
     -  3699111*cosD(d2 - Mp)
     -  2955968*cosD(d2)
     -   569925*cosD(m2)
     +    48888*cosD(M)
     -     3149*cosD(f2)
     +   246158*cosD(d2 - m2)
     -   152138*cosD(d2 - M - Mp)
     -   170733*cosD(d2 + Mp)
     -   204586*cosD(d2 - M)
     -   129620*cosD(M - Mp)
     +   108743*cosD(D)
     +   104755*cosD(M + Mp)
     +    10321*cosD(d2 - f2)
     +    79661*cosD(Mp - f2)
     -    34782*cosD(2*d2 - Mp)
     -    23210*cosD(3*Mp)
     -    21636*cosD(2*d2 - m2)
  ) / 1000;

  return { lon: norm360(lon - 1.396971 * T), dist: dist };
}

/* =========================================================
   7. Einheitlicher Mondzustand
   ========================================================= */
function moonState(m, t){
  if (m.ephem === 'gal'){
    return { lon: norm360(m.lon0 + m.n * t), rKm: m.rKm };
  }
  const e = moonEphem(t);
  return { lon: e.lon, rKm: e.dist };
}

function phaseName(p){
  if (p < 5 || p > 355) return 'Neumond';
  if (p < 85)  return 'zunehmende Sichel';
  if (p < 95)  return 'zunehmender Halbmond';
  if (p < 175) return 'zunehmender Dreiviertelmond';
  if (p < 185) return 'Vollmond';
  if (p < 265) return 'abnehmender Dreiviertelmond';
  if (p < 275) return 'abnehmender Halbmond';
  return 'abnehmende Sichel';
}

let moonLive = { lon: 0, dist: MOON_MEAN_DIST, psi: 0, illum: 0.5 };

function updateMoonLive(){
  const e = moonEphem(state.t);
  const sunLon = norm360(bodyLon(BY_ID.erde, state.t) + 180);
  const psi = norm360(e.lon - sunLon);
  moonLive = {
    lon: e.lon,
    dist: e.dist,
    psi: psi,
    illum: (1 - Math.cos(psi * DEG)) / 2
  };
}

function daysFromYMD(y, m, d){
  const dt = new Date(Date.UTC(2000, 0, 1, 12, 0, 0));
  dt.setUTCFullYear(y, m - 1, d);
  return (dt.getTime() - J2000) / 86400000;
}
function ymdString(d){
  const y = d.getUTCFullYear();
  const ys = y < 0 ? '-' + String(-y).padStart(4, '0') : String(y).padStart(4, '0');
  return ys + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +

}

const cv = document.getElementById('sky');

const w2s = (x, y) => {
  const s = state.base * state.zoom;
  return { x: W/2 + state.panX + x*s, y: H/2 + state.panY - y*s };
};
const s2w = (sx, sy) => {
  const s = state.base * state.zoom;
  return { x: (sx - W/2 - state.panX)/s, y: -(sy - H/2 - state.panY)/s };
};

function computeBase(){
  const maxA = state.showDwarfs ? 49.6 : 30.6;
  const worldMax = project(maxA) * 1.06;
  const pad = Math.min(W, H) < 620 ? 30 : 44;
  state.base = Math.max(0.001, Math.min(W, H) / 2 - pad) / worldMax;
}

function makeStars(){

      a: 0.18 + Math.random() * 0.62,

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  vscale = clamp(Math.min(W, H) / 820, 0.80, 1.35);

  skyGrad = ctx.createRadialGradient(W*0.5, H*0.44, 0, W*0.5, H*0.44, Math.max(W, H) * 0.85);
  skyGrad.addColorStop(0, '#0a1128');
  skyGrad.addColorStop(0.45, '#060a18');
  skyGrad.addColorStop(1, '#02030a');

  makeStars();
  computeBase();
}

/* =========================================================
   10. Größenlogik
   ========================================================= */
function planetRadius(b){
  const v = vscale * state.sizeMul;
  const z = Math.pow(state.zoom, 0.28);
  if (state.trueScale) return Math.max(2.4 * v, b.size * 1.15 * v * z);
  return Math.max(3.6 * v, b.size * 2.05 * v * z);
}
function sunRadius(){
  if (state.trueScale)
    return clamp(9 * vscale * Math.pow(state.zoom, 0.22), 5, 52);
  return clamp(20 * vscale * Math.pow(state.zoom, 0.18), 11, 96);
}

/* =========================================================
   11. Zeichnen – Grundgerüst
   ========================================================= */
function drawStars(time){
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const tw = 0.72 + 0.28 * Math.sin(time * s.sp + s.ph);
    const x = s.x * W, y = s.y * H;
    ctx.fillStyle = s.tint > 0.82
      ? 'rgba(190,210,255,' + (s.a * tw) + ')'
      : (s.tint < 0.14 ? 'rgba(255,226,198,' + (s.a * tw) + ')'
                       : 'rgba(232,240,255,' + (s.a * tw) + ')');
    if (s.r > 1.15){
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillRect(x, y, s.r, s.r);
    }
  }
}

function drawDust(list, colorPrefix, alphaMul){
  const s = state.base * state.zoom;
  const cx = W/2 + state.panX, cy = H/2 + state.panY;
  for (let i = 0; i < list.length; i++){
    const k = list[i];
    const lam = k.ph + TAU * (state.t / (365.25 * Math.pow(k.a, 1.5)));
    const R = project(k.a * (1 - k.e * Math.cos(lam)));
    const x = cx + R * Math.cos(lam) * s;
    const y = cy - R * Math.sin(lam) * s;
    if (x < -6 || x > W + 6 || y < -6 || y > H + 6) continue;
    ctx.fillStyle = colorPrefix + (k.al * alphaMul) + ')';
    ctx.fillRect(x, y, k.s, k.s);
  }
}

function drawOrbits(){
  for (const b of BODIES){
    if (b.isDwarf && !state.showDwarfs) continue;
    const p = b.path;
    const active = (state.hover === b.id || state.selected === b.id);
    ctx.beginPath();
    for (let i = 0; i < p.length; i += 2){
      const s = w2s(p[i], p[i+1]);
      if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
    }
    ctx.closePath();
    ctx.lineWidth = active ? 1.5 : 1;
    ctx.strokeStyle = rgba(b.light, active ? 0.55 : 0.19);
    ctx.stroke();
  }
}

function drawTrail(b){
  const span = b.period * 0.16 * state.dir;
  const N = 16;
  const start = bodyWorld(b, state.t);
  let prev = w2s(start.x, start.y);
  const baseW = clamp(planetRadius(b) * 0.42, 0.9, 4.5);

  ctx.lineCap = 'round';
  for (let i = 1; i <= N; i++){
    const q = bodyWorld(b, state.t - span * i / N);
    const s = w2s(q.x, q.y);
    const f = 1 - i / N;
    ctx.strokeStyle = rgba(b.light, 0.40 * f * f);
    ctx.lineWidth = baseW * f;
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
    prev = s;
  }
}

/* =========================================================
   12. Planetenkörper
   ========================================================= */
function drawDisc(b, sx, sy, r, sunS){
  const flat = b.flat || 1;
  const ry = r * flat;
  const ang = Math.atan2(sunS.y - sy, sunS.x - sx);
  const dx = Math.cos(ang), dy = Math.sin(ang);

  ctx.save();
  ctx.beginPath();
  ctx.ellipse(sx, sy, r, ry, 0, 0, TAU);
  ctx.clip();

  const base = ctx.createRadialGradient(
    sx + dx * r * 0.42, sy + dy * ry * 0.42, r * 0.06,
    sx + dx * r * 0.10, sy + dy * ry * 0.10, r * 1.45
  );
  base.addColorStop(0, b.light);
  base.addColorStop(0.46, b.color);
  base.addColorStop(1, b.dark);
  ctx.fillStyle = base;
  ctx.fillRect(sx - r, sy - ry, r * 2, ry * 2);

  if (b.bands){
    for (let i = 0; i < b.bands.length; i++){
      const bd = b.bands[i];
      const y0 = sy + bd[0] * ry;
      const y1 = sy + bd[1] * ry;
      const mid = (y0 + y1) / 2;
      const bulge = 1 + 0.10 * Math.abs((mid - sy) / ry);
      ctx.fillStyle = bd[2];
      ctx.fillRect(sx - r * bulge, Math.min(y0, y1) - 0.4, r * 2 * bulge, Math.abs(y1 - y0) + 0.8);
    }
  }

  if (b.spot){
    const sp = b.spot;
    ctx.save();
    ctx.translate(sx + sp.x * r, sy + sp.y * ry);
    ctx.rotate(sp.rot);
    const gs = ctx.createRadialGradient(0, 0, 0, 0, 0, sp.rx * r);
    gs.addColorStop(0, sp.c1);
    gs.addColorStop(1, sp.c2);
    ctx.fillStyle = gs;
    ctx.beginPath();
    ctx.ellipse(0, 0, sp.rx * r, sp.ry * r, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  if (b.land){
    ctx.fillStyle = b.landColor || '#3f7d4e';
    for (let i = 0; i < b.land.length; i++){
      const l = b.land[i];
      ctx.beginPath();
      ctx.ellipse(sx + l[0] * r, sy + l[1] * ry, l[2] * r, l[3] * ry, l[4], 0, TAU);
      ctx.fill();
    }
  }

  if (b.caps){
    ctx.fillStyle = 'rgba(244,250,255,' + b.caps + ')';
    ctx.beginPath();
    ctx.ellipse(sx, sy - ry * 0.90, r * 0.52, ry * 0.16, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sx, sy + ry * 0.90, r * 0.46, ry * 0.14, 0, 0, TAU);
    ctx.fill();
  }

  const term = ctx.createLinearGradient(
    sx + dx * r * 0.62, sy + dy * ry * 0.62,
    sx - dx * r * 1.20, sy - dy * ry * 1.20
  );
  term.addColorStop(0, 'rgba(255,255,255,' + (b.gas ? 0.06 : 0.14) + ')');
  term.addColorStop(0.52, 'rgba(0,0,0,0)');
  term.addColorStop(1, 'rgba(0,0,0,0.74)');
  ctx.fillStyle = term;
  ctx.fillRect(sx - r, sy - ry, r * 2, ry * 2);

  const limb = ctx.createRadialGradient(sx, sy, r * 0.62, sx, sy, r * 1.02);
  limb.addColorStop(0, 'rgba(0,0,0,0)');
  limb.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = limb;
  ctx.fillRect(sx - r, sy - ry, r * 2, ry * 2);

  ctx.restore();

  ctx.beginPath();
  ctx.ellipse(sx, sy, r, ry, 0, 0, TAU);
  ctx.strokeStyle = rgba(b.dark, 0.62);
  ctx.lineWidth = Math.max(0.6, r * 0.075);
  ctx.stroke();
}

  [1.53, 1.94, 232, 218, 186, 0.82],
  [2.02, 2.18, 205, 191, 160, 0.64],
  [2.21, 2.26, 198, 184, 154, 0.58],
  [2.32, 2.37, 176, 166, 146, 0.20]
];

function drawRings(sx, sy, r, back){
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(RING_TILT);

  const a0 = back ? Math.PI : 0;
  const a1 = back ? TAU : Math.PI;
  const dim = back ? 0.66 : 1;

  for (let i = 0; i < RING_BANDS.length; i++){
    const rb = RING_BANDS[i];
    const ro = rb[1] * r, ri = rb[0] * r;
    if (ro < 1.2) continue;

    ctx.beginPath();
    ctx.ellipse(0, 0, ro, ro * RING_SQUASH, 0, a0, a1, false);
    ctx.ellipse(0, 0, ri, ri * RING_SQUASH, 0, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = 'rgba(' + rb[2] + ',' + rb[3] + ',' + rb[4] + ',' + (rb[5] * dim) + ')';
    ctx.fill();
  }

  ctx.restore();
}

/* =========================================================
   14. Sonne
   ========================================================= */
function drawSun(time){
  const s = w2s(0, 0);
  const r = sunRadius();
  const pulse = 1 + 0.03 * Math.sin(time * 1.6);

  const gr = r * 6 * pulse;
  const g = ctx.createRadialGradient(s.x, s.y, r * 0.92, s.x, s.y, gr);
  g.addColorStop(0,    'rgba(255,244,205,.92)');
  g.addColorStop(0.13, 'rgba(255,214,130,.40)');
  g.addColorStop(0.34, 'rgba(255,158,60,.13)');
  g.addColorStop(0.66, 'rgba(255,120,30,.042)');
  g.addColorStop(1,    'rgba(255,90,20,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.x, s.y, gr, 0, TAU);
  ctx.fill();

  const core = ctx.createRadialGradient(
    s.x - r * 0.26, s.y - r * 0.26, r * 0.05,
    s.x, s.y, r
  );
  core.addColorStop(0,    '#ffffff');
  core.addColorStop(0.48, '#fff4c8');
  core.addColorStop(0.84, '#ffcf6e');
  core.addColorStop(1,    '#f6a338');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(s.x, s.y, r, 0, TAU);
  ctx.fill();

  positions.sonne = { sx: s.x, sy: s.y, r };
}

/* =========================================================
   15. Monde mit Bewegungsspur
   ---------------------------------------------------------
   Bei hoher Simulationsgeschwindigkeit überstreicht z. B. Io
   mehrere zehntausend Grad pro Sekunde. Statt eines flackernden
   Punktes wird die in der letzten Frame tatsächlich durchlaufene
   Bahnstrecke gezeichnet – bei extremem Tempo ein ganzer Ring.
   ========================================================= */
function drawMoonSmear(px, py, orbR, angNow, sweep, color, width){
  const sw = Math.abs(sweep);

  if (sw >= TAU){
    ctx.beginPath();
    ctx.arc(px, py, orbR, 0, TAU);
    ctx.strokeStyle = rgba(color, 0.26);
    ctx.lineWidth = Math.max(1, width * 0.85);
    ctx.stroke();
    return;
  }

  const N = 14;
  ctx.lineCap = 'round';
  for (let i = 0; i < N; i++){
    const a0 = angNow - sweep + sweep * (i / N);
    const a1 = angNow - sweep + sweep * ((i + 1) / N);
    const f = (i + 1) / N;
    ctx.strokeStyle = rgba(color, 0.40 * f * f);
    ctx.lineWidth = Math.max(0.75, width * f);
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(a0) * orbR, py - Math.sin(a0) * orbR);
    ctx.lineTo(px + Math.cos(a1) * orbR, py - Math.sin(a1) * orbR);
    ctx.stroke();
  }
}

function drawMoons(parent, px, py, pr){
  const list = MOONS_OF[parent.id];
  if (!list) return;
  const showPaths = state.showOrbits && state.zoom > 1.7;

  for (let i = 0; i < list.length; i++){
    const m = list[i];
    const st = moonState(m, state.t);

    const orbR = (m.ephem === 'elp')
      ? pr * m.dist * (st.rKm / MOON_MEAN_DIST)
      : pr * m.dist;

    const ang = st.lon * DEG;
    const mx = px + Math.cos(ang) * orbR;
    const my = py - Math.sin(ang) * orbR;
    const mr = Math.max(1.4 * vscale, pr * m.size);

    if (showPaths){
      ctx.beginPath();
      ctx.arc(px, py, orbR, 0, TAU);
      ctx.strokeStyle = rgba(m.light, 0.15);
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    /* Bewegungsspur: Winkelüberstreichung der letzten Frame */
    if (state.dTw){
      const sweep = (m.rate * DEG) * state.dTw;
      if (Math.abs(sweep) > 0.015){
        drawMoonSmear(px, py, orbR, ang, sweep, m.light, mr);
      }
    }

    positions[m.id] = { sx: mx, sy: my, r: mr };

    const hot = (state.hover === m.id || state.selected === m.id);
    const g = ctx.createRadialGradient(
      mx - mr * 0.35, my - mr * 0.35, mr * 0.05,
      mx, my, mr * 1.15
    );
    g.addColorStop(0, m.light);
    g.addColorStop(1, m.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, TAU);
    ctx.fill();

    if (hot){
      ctx.beginPath();
      ctx.arc(mx, my, mr + 4, 0, TAU);
      ctx.strokeStyle = rgba(m.light, 0.85);
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
  }
}

/* =========================================================
   16. Körper, Labels, Render
   ========================================================= */
function drawBodies(){
  const sunS = w2s(0, 0);

  for (const b of BODIES){
    if (b.isDwarf && !state.showDwarfs) continue;

    const q = bodyWorld(b, state.t);
    const s = w2s(q.x, q.y);
    const r = planetRadius(b);
    positions[b.id] = { sx: s.x, sy: s.y, r };

    if (state.showTrails) drawTrail(b);

    const gl = ctx.createRadialGradient(s.x, s.y, r * 0.75, s.x, s.y, r * 2.7);
    gl.addColorStop(0, rgba(b.light, 0.18));
    gl.addColorStop(1, rgba(b.light, 0));
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 2.7, 0, TAU);
    ctx.fill();

    if (b.ring) drawRings(s.x, s.y, r, true);
    drawDisc(b, s.x, s.y, r, sunS);
    if (b.ring) drawRings(s.x, s.y, r, false);

    if (state.hover === b.id || state.selected === b.id){
      ctx.beginPath();
      ctx.arc(s.x, s.y, r + 7, 0, TAU);
      ctx.strokeStyle = rgba(b.light, 0.75);
      ctx.lineWidth = 1.3;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    drawMoons(b, s.x, s.y, r);
  }
}

function drawLabels(){
  if (!state.showLabels) return;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.92)';
  ctx.shadowBlur = 6;

  ctx.font = '600 11px ui-sans-serif,system-ui,-apple-system,sans-serif';
  for (const b of BODIES){
    if (b.isDwarf && !state.showDwarfs) continue;
    const p = positions[b.id];
    if (!p) continue;
    const hot = (state.hover === b.id || state.selected === b.id);
    ctx.fillStyle = hot ? '#ffffff' : 'rgba(202,216,247,.62)';
    ctx.fillText(b.name, p.sx + p.r + 7, p.sy);
  }

  if (positions.sonne){
    ctx.fillStyle = 'rgba(255,226,170,.82)';
    ctx.fillText('Sonne', positions.sonne.sx + positions.sonne.r + 9, positions.sonne.sy);
  }

  ctx.font = '500 9.5px ui-sans-serif,system-ui,sans-serif';
  for (const m of MOONS){
    const p = positions[m.id];
    if (!p) continue;
    const hot = (state.hover === m.id || state.selected === m.id);
    if (!hot && state.zoom < 2.3) continue;
    ctx.fillStyle = hot ? '#ffffff' : 'rgba(196,210,240,.52)';
    ctx.fillText(m.name, p.sx + p.r + 4, p.sy);
  }

  ctx.shadowBlur = 0;
}

function render(time){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  updateMoonLive();

  drawStars(time);
  if (state.showBelt) drawDust(belt, 'rgba(176,186,210,', 1);
  if (state.showBelt && state.showDwarfs) drawDust(kuiper, 'rgba(150,170,220,', 1);
  if (state.showOrbits) drawOrbits();

  positions = {};
  drawSun(time);
  drawBodies();
  drawLabels();
}

/* =========================================================
   17. Mondphasen-Symbol
   ========================================================= */
function drawPhaseIcon(cvs){
  if (!cvs) return;
  const g = cvs.getContext('2d');
  const s = cvs.width;
  const r = s * 0.42, cx = s / 2, cy = s / 2;

  g.clearRect(0, 0, s, s);
  g.beginPath();
  g.arc(cx, cy, r, 0, TAU);
  g.fillStyle = '#171d2c';
  g.fill();

  const psi = moonLive.psi * DEG;
  const a = r * Math.abs(Math.cos(psi));
  const gibbous = Math.cos(psi) < 0;

  g.save();
  g.beginPath();
  g.arc(cx, cy, r, -Math.PI/2, Math.PI/2, false);
  g.ellipse(cx, cy, a, r, 0, Math.PI/2, -Math.PI/2, gibbous ? false : true);
  g.closePath();
  const gr = g.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  gr.addColorStop(0, '#fdf9ec');
  gr.addColorStop(1, '#cfc7b3');
  g.fillStyle = gr;
  g.fill();
  g.restore();

  g.beginPath();
  g.arc(cx, cy, r, 0, TAU);
  g.strokeStyle = 'rgba(200,215,245,.35)';
  g.lineWidth = Math.max(1, s * 0.012);
  g.stroke();
}

/* =========================================================
   19. Interaktion
   ========================================================= */
const mouse = { x: -999, y: -999 };
let dragging = false, dragMoved = 0, lastPt = null;

function hitTest(x, y){
  let best = null, bd = 1e9;

  const consider = (id, minTh) => {
    const p = positions[id];
    if (!p) return;
    const d = Math.hypot(p.sx - x, p.sy - y);
    const th = Math.max(minTh, p.r + 9);
    if (d < th && d < bd){ bd = d; best = id; }
  };

  for (let i = 0; i < BODIES.length; i++){
    const b = BODIES[i];
    if (b.isDwarf && !state.showDwarfs) continue;
    consider(b.id, 17);
  }
  for (let i = 0; i < MOONS.length; i++) consider(MOONS[i].id, 11);

  const s = positions.sonne;
  if (s){
    const d = Math.hypot(s.sx - x, s.sy - y);
    if (d < Math.max(30, s.r + 10) && d < bd){ bd = d; best = 'sonne'; }
  }
  return best;
}

function updateHover(){
  state.hover = hitTest(mouse.x, mouse.y);
  if (!dragging) cv.style.cursor = state.hover ? 'pointer' : 'grab';
}

cv.addEventListener('pointerdown', e => {
  dragging = true; dragMoved = 0;
  lastPt = { x: e.clientX, y: e.clientY };
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  cv.classList.add('grabbing');
});

cv.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (dragging && lastPt){
    const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    state.panX += dx;
    state.panY += dy;
    lastPt = { x: e.clientX, y: e.clientY };
  } else {
    updateHover();
  }
});

cv.addEventListener('pointerup', e => {
  cv.classList.remove('grabbing');
  if (dragging && dragMoved < 7){
    select(hitTest(e.clientX, e.clientY));
  }
  dragging = false;
  lastPt = null;
  updateHover();
});
cv.addEventListener('pointercancel', () => { dragging = false; lastPt = null; });
cv.addEventListener('pointerleave', () => { if (!dragging) state.hover = null; });

function zoomAt(mx, my, f){
  const before = s2w(mx, my);
  state.zoom = clamp(state.zoom * f, 0.3, 60);
  const s = state.base * state.zoom;
  state.panX = mx - W/2 - before.x * s;
  state.panY = my - H/2 + before.y * s;
}

cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

cv.addEventListener('dblclick', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, 1.9);
});

  if (d < 1)  return d.toFixed(2).replace('.', ',') + ' Tage/s';
  if (d < 60) return d.toFixed(d < 10 ? 1 : 0).replace('.', ',') + ' Tage/s';
  const y = d / 365.25;
  return y.toFixed(y < 10 ? 2 : 1).replace('.', ',') + ' Jahre/s';
}

  const v = dateIn.value;

  const parts = v.split('-').map(Number);

window.addEventListener('keydown', e => {

  if (e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
  else if (e.key === 'r' || e.key === 'R'){ resetView(); }
  else if (e.key === 't' || e.key === 'T'){ goToday(); }
  else if (e.key === 'd' || e.key === 'D'){ dirBtn.click(); }
  else if (e.key === '+' || e.key === '='){ zoomAt(W/2, H/2, 1.3); }
  else if (e.key === '-' || e.key === '_'){ zoomAt(W/2, H/2, 1/1.3); }
  else if (e.key === 'Escape'){ select(null); }
});

window.addEventListener('resize', () => {
  const oldBase = state.base;
  resize();
  if (oldBase > 0){
    const k = state.base / oldBase;
    state.panX *= k;
    state.panY *= k;
  }
});

/* =========================================================
   21. Hauptschleife
   ========================================================= */
const fmtDate = new Intl.DateTimeFormat('de-DE', {
  day:'2-digit', month:'long', year:'numeric'
});
let last = 0, uiTimer = 0;

function frame(now){
  if (!last) last = now;
  const dt = Math.min(0.06, (now - last) / 1000);
  last = now;

  let dTw = 0;
  if (state.playing){
    dTw = dt * state.speed * state.dir;
    state.t += dTw;
  }
  if (state.jump){ dTw = 0; state.jump = false; }
  state.dTw = dTw;

  render(now / 1000);

  uiTimer += dt;
  if (uiTimer > 0.1){
    uiTimer = 0;
    const d = dateAt();
    dateEl.textContent = fmtDate.format(d);
    if (document.activeElement !== dateIn) dateIn.value = ymdString(d);
    updateMoonCard();

    const parts = [];
    if (state.dir < 0) parts.push('◀ rückwärts');
    if (state.speed > 60){
      const secPerYear = 365.25 / state.speed;
      parts.push('1 Jahr ≈ ' + secPerYear.toFixed(secPerYear < 10 ? 1 : 0) + ' s');
    }
    parts.push(state.trueScale ? 'echter Maßstab' : 'logarithmische Skala');
    subEl.textContent = parts.join(' · ');
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   22. Start
   ========================================================= */
resize();
for (const b of BODIES) buildPath(b);
makeBelts();
buildChips();
computeBase();
updateMoonLive();
requestAnimationFrame(frame);

setTimeout(() => {
  const tip = document.getElementById('tip');
  tip.style.opacity = '0';
  setTimeout(() => tip.remove(), 900);
}, 7000);

})();
</script>
